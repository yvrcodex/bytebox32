; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = bytebox32
extra_configs = secrets.ini

[env:bytebox32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -Os
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCORE_DEBUG_LEVEL=3
    -DAP_PASSWORD=\"${secrets.ap_password}\"
    -DOTA_PASSWORD=\"${secrets.ota_password}\"
    -DWEB_PASSWORD=\"${secrets.web_password}\"

[env:bytebox32_ota]
extends = env:bytebox32
upload_protocol = espota
upload_port = bytebox32.local
upload_flags =
    --host_port=3233
    --auth=${secrets.ota_password}
